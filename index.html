<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EasyShop Bot</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #444;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            width: 220px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .btn {
            background: #28a745;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 EasyShop Bot</h1>
    <p>Your Smart Shopping Assistant</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Electronics</a>
    <a href="#">Shoes</a>
    <a href="#">Clothing</a>
</nav>

<div class="container">

    <h2>🔥 Featured Products</h2>

    <div class="products">

        <!-- Electronics -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Mobile">
            <h3>Smartphone</h3>
            <p>₹10,000</p>
            <button class="btn">Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" alt="Laptop">
            <h3>Laptop</h3>
            <p>₹40,000</p>
            <button class="btn">Buy Now</button>
        </div>

        <!-- Shoes -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="Nike Shoes">
            <h3>Nike Shoes</h3>
            <p>₹2,500</p>
            <button class="btn">Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1528701800489-20be3c5c2c1f" alt="Adidas Shoes">
            <h3>Adidas Shoes</h3>
            <p>₹3,000</p>
            <button class="btn">Buy Now</button>
        </div>

        <!-- Clothing -->
        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab" alt="Tshirt">
            <h3>T-Shirt</h3>
            <p>₹800</p>
            <button class="btn">Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246" alt="Jeans">
            <h3>Jeans</h3>
            <p>₹1,500</p>
            <button class="btn">Buy Now</button>
        </div>

    </div>
</div>

<!-- 🤖 Watson Assistant -->
<script>
  window.watsonAssistantChatOptions = {
    integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
    region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
    serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
    onLoad: async (instance) => { await instance.render(); }
  };

  setTimeout(function(){
    const t=document.createElement('script');
    t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
          + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
          + "/WatsonAssistantChatEntry.js";
    document.head.appendChild(t);
  });
</script>

</body>
</html>
