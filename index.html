<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyShop Shoes</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    display:flex;
    justify-content:space-between;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.hero{
    height:350px;
    background:url('images/banner.jpg');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.hero h1{
    background:rgba(0,0,0,0.5);
    padding:20px;
}

.container{
    padding:40px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:20px;
    text-align:center;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
}

button{
    background:#111827;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

</style>
</head>

<body>

<header>

<h2>👟 EasyShop Shoes</h2>

<nav>
    <a href="#">Home</a>
    <a href="#">Nike</a>
    <a href="#">Adidas</a>
    <a href="#">Puma</a>
</nav>

</header>

<div class="hero">
    <h1>Best Trending Shoes Collection</h1>
</div>

<div class="container">

<h1>🔥 Trending Shoes</h1>

<div class="products">

<div class="card">
    <img src="images/shoe1.jpg">
    <div class="card-content">
        <h2>Nike Air Max</h2>
        <p class="price">₹2,999</p>
        <button>Buy Now</button>
    </div>
</div>

<div class="card">
    <img src="images/shoe2.jpg">
    <div class="card-content">
        <h2>Adidas Sneakers</h2>
        <p class="price">₹3,499</p>
        <button>Buy Now</button>
    </div>
</div>

<div class="card">
    <img src="images/shoe3.jpg">
    <div class="card-content">
        <h2>Puma Runner</h2>
        <p class="price">₹2,799</p>
        <button>Buy Now</button>
    </div>
</div>

<div class="card">
    <img src="images/shoe4.jpg">
    <div class="card-content">
        <h2>Sports Shoes</h2>
        <p class="price">₹3,199</p>
        <button>Buy Now</button>
    </div>
</div>

</div>

</div>

<footer>
© 2026 EasyShop Shoes
</footer>

<!-- Watson Assistant -->

<script>
window.watsonAssistantChatOptions = {
  integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
  region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
  serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
  onLoad: async (instance) => { await instance.render(); }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
        + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
        + "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
