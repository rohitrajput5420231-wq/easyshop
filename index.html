<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyShop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f7fa}

header{
  background:#0d1b2a;
  color:#fff;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
}

nav a{
  color:#fff;
  margin:0 15px;
  text-decoration:none;
}

.hero{
  background:url('https://images.pexels.com/photos/5632402/pexels-photo-5632402.jpeg') center/cover;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
}

.hero h2{
  background:rgba(0,0,0,0.5);
  padding:10px 20px;
  border-radius:10px;
}

.container{padding:40px}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:15px;
  text-align:center;
}

.price{color:#2a9d8f;font-weight:bold}

.btn{
  background:#e63946;
  color:#fff;
  border:none;
  padding:8px 15px;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h1>🛒 EasyShop</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Electronics</a>
    <a href="#">Shoes</a>
    <a href="#">Clothing</a>
  </nav>
</header>

<div class="hero">
  <h2>Shop Smart with EasyShop AI 🤖</h2>
</div>

<div class="container">
  <h2>🔥 Trending Products</h2>

  <div class="products">

    <!-- Electronics -->
    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2017/01/22/19/20/smartphone-2001173_1280.jpg">
      <div class="card-content">
        <h3>Smartphone</h3>
        <p class="price">₹10,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2016/11/29/12/54/laptop-1869236_1280.jpg">
      <div class="card-content">
        <h3>Laptop</h3>
        <p class="price">₹40,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <!-- Shoes -->
    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2016/11/29/03/53/adult-1868750_1280.jpg">
      <div class="card-content">
        <h3>Running Shoes</h3>
        <p class="price">₹2,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2017/08/06/00/30/shoes-2589593_1280.jpg">
      <div class="card-content">
        <h3>Sports Sneakers</h3>
        <p class="price">₹3,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <!-- Clothing -->
    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2016/03/27/19/31/fashion-1283863_1280.jpg">
      <div class="card-content">
        <h3>T-Shirt</h3>
        <p class="price">₹800</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://cdn.pixabay.com/photo/2017/08/06/10/12/jeans-2593890_1280.jpg">
      <div class="card-content">
        <h3>Denim Jeans</h3>
        <p class="price">₹1,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

  </div>
</div>

<footer style="background:#0d1b2a;color:#fff;text-align:center;padding:15px;margin-top:40px;">
  © 2026 EasyShop | Powered by Watson Assistant 🤖
</footer>

<!-- Watson Chatbot -->
<script>
window.watsonAssistantChatOptions = {
  integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
  region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
  serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
  onLoad: async (instance) => { await instance.render(); }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
        + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
        + "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
