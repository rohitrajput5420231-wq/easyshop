<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyShop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f7fa}

header{
  background:#0d1b2a;
  color:#fff;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{font-size:24px}

nav a{
  color:#fff;
  margin:0 15px;
  text-decoration:none;
  font-weight:500;
}

.hero{
  background:url('https://images.unsplash.com/photo-1607083206968-13611e3d76db') center/cover;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align:center;
}

.hero h2{font-size:36px;background:rgba(0,0,0,0.5);padding:10px 20px;border-radius:10px}

.container{padding:40px}

.section-title{
  margin-bottom:20px;
  font-size:24px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{transform:translateY(-5px)}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:15px;
  text-align:center;
}

.card-content h3{margin-bottom:10px}

.price{color:#2a9d8f;font-weight:bold;margin-bottom:10px}

.btn{
  background:#e63946;
  color:#fff;
  border:none;
  padding:8px 15px;
  border-radius:5px;
  cursor:pointer;
}

.btn:hover{background:#d62828}

footer{
  background:#0d1b2a;
  color:#fff;
  text-align:center;
  padding:15px;
  margin-top:40px;
}

</style>
</head>

<body>

<header>
  <h1>🛒 EasyShop</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Electronics</a>
    <a href="#">Shoes</a>
    <a href="#">Clothing</a>
  </nav>
</header>

<div class="hero">
  <h2>Shop Smart with EasyShop AI 🤖</h2>
</div>

<div class="container">
  <h2 class="section-title">🔥 Trending Products</h2>

  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
      <div class="card-content">
        <h3>Smartphone</h3>
        <p class="price">₹10,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
      <div class="card-content">
        <h3>Laptop</h3>
        <p class="price">₹40,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
      <div class="card-content">
        <h3>Nike Shoes</h3>
        <p class="price">₹2,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1528701800489-20be3c5c2c1f">
      <div class="card-content">
        <h3>Adidas Shoes</h3>
        <p class="price">₹3,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab">
      <div class="card-content">
        <h3>T-Shirt</h3>
        <p class="price">₹800</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246">
      <div class="card-content">
        <h3>Jeans</h3>
        <p class="price">₹1,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

  </div>
</div>

<footer>
  <p>© 2026 EasyShop | Powered by Watson Assistant 🤖</p>
</footer>

<!-- Watson Chatbot -->
<script>
window.watsonAssistantChatOptions = {
  integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
  region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
  serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
  onLoad: async (instance) => { await instance.render(); }
};
setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
        + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
        + "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
