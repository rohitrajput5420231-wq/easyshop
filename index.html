<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyShop Shoes</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f3f4f6;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:40px;
}

.card{
    background:white;
    width:250px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-content{
    padding:15px;
    text-align:center;
}

.price{
    color:green;
    font-weight:bold;
    font-size:20px;
}

button{
    background:#111827;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>👟 EasyShop Shoes</h1>
<p>Best Sneakers Collection</p>
</header>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600">
<div class="card-content">
<h2>Nike Shoes</h2>
<p class="price">₹2,999</p>
<button>Buy Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=600">
<div class="card-content">
<h2>Adidas Sneakers</h2>
<p class="price">₹3,499</p>
<button>Buy Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600">
<div class="card-content">
<h2>Puma Runner</h2>
<p class="price">₹2,799</p>
<button>Buy Now</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=600">
<div class="card-content">
<h2>Sports Shoes</h2>
<p class="price">₹3,199</p>
<button>Buy Now</button>
</div>
</div>

</div>

<!-- Watson Assistant -->

<script>
window.watsonAssistantChatOptions = {
  integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
  region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
  serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
  onLoad: async (instance) => { await instance.render(); }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
        + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
        + "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
