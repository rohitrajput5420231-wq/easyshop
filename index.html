<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyShop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f7fa}

header{
  background:#0d1b2a;
  color:#fff;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items: center;
}

nav a{
  color:#fff;
  margin:0 15px;
  text-decoration:none;
}

.hero{
  background:#1b263b;
  height:250px;
  display:flex;
  flex-direction: column;
  align-items:center;
  justify-content:center;
  color:#fff;
  text-align: center;
}

.container{padding:40px}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.1);
  transition: transform 0.3s ease;
}

.card:hover {
  transform: translateY(-5px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:15px;
  text-align:center;
}

.price{color:#2a9d8f;font-weight:bold; font-size: 1.2rem; margin: 10px 0;}

.btn{
  background:#e63946;
  color:#fff;
  border:none;
  padding:10px 20px;
  border-radius:5px;
  cursor:pointer;
  width: 100%;
  font-weight: 600;
}
</style>
</head>

<body>

<header>
  <h1>🛒 EasyShop</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Electronics</a>
    <a href="#">Shoes</a>
    <a href="#">Clothing</a>
  </nav>
</header>

<div class="hero">
  <h2>Shop Smart with EasyShop AI 🤖</h2>
  <p>Experience the future of personalized shopping</p>
</div>

<div class="container">
  <h2 style="margin-bottom: 25px;">🔥 Featured Products</h2>

  <div class="products">

    <!-- Electronics -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=500&auto=format&fit=crop" alt="Smartphone">
      <div class="card-content">
        <h3>Smartphone</h3>
        <p class="price">₹10,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?q=80&w=500&auto=format&fit=crop" alt="Laptop">
      <div class="card-content">
        <h3>Laptop</h3>
        <p class="price">₹40,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <!-- Shoes -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500&auto=format&fit=crop" alt="Running Shoes">
      <div class="card-content">
        <h3>Running Shoes</h3>
        <p class="price">₹2,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=500&auto=format&fit=crop" alt="Sneakers">
      <div class="card-content">
        <h3>Sneakers</h3>
        <p class="price">₹3,000</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <!-- Clothing -->
    <div class="card">
      <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=500&auto=format&fit=crop" alt="T-Shirt">
      <div class="card-content">
        <h3>T-Shirt</h3>
        <p class="price">₹800</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542272604-787c3835535d?q=80&w=500&auto=format&fit=crop" alt="Jeans">
      <div class="card-content">
        <h3>Jeans</h3>
        <p class="price">₹1,500</p>
        <button class="btn">Buy Now</button>
      </div>
    </div>

  </div>
</div>

<footer style="background:#0d1b2a;color:#fff;text-align:center;padding:20px;margin-top:40px;">
  © 2026 EasyShop | Powered by AI
</footer>

<!-- Watson Chatbot -->
<script>
window.watsonAssistantChatOptions = {
  integrationID: "4b4b1c05-b5e1-45ce-8447-f4dae399580a",
  region: "https://integrations.au-syd.assistant.watson.appdomain.cloud",
  serviceInstanceID: "cefdacbe-1323-420d-8ae8-9eff2c0e2398",
  onLoad: async (instance) => { await instance.render(); }
};

setTimeout(function(){
  const t=document.createElement('script');
  t.src="https://web-chat.global.assistant.watson.appdomain.cloud/versions/" 
        + (window.watsonAssistantChatOptions.clientVersion || 'latest') 
        + "/WatsonAssistantChatEntry.js";
  document.head.appendChild(t);
});
</script>

</body>
</html>
